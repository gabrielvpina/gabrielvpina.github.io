project:
  type: website
  output-dir: docs

website:
  title: "me.log"
  site-url: https://gabrielvpina.github.io
  favicon: assets/favicon.png
  open-graph: true
  twitter-card: true
  navbar:
    # Cores da navbar vivem em styles/retro.scss ($navbar-bg/$navbar-fg/$navbar-hl)
    left:
      - href: posts/index.qmd
        text: "/posts"
      - href: publications/index.qmd
        text: "/publications"
      - href: projects/index.qmd
        text: "/projects"
      - href: about/index.qmd
        text: "/about"
    tools:
      - icon: github
        href: https://github.com/gabrielvpina
  page-footer:
    # Cores do footer vivem em styles/retro.scss ($footer-bg/$footer-fg)
    center: "© gabriel_pina :: 2026"
    border: false

format:
  html:
    # O tema customizado é compilado JUNTO com o flatly (não é um css
    # solto carregado depois), o que permite configurar o Bootstrap
    # a partir das variáveis em scss:defaults.
    theme:
      - flatly
      - styles/retro.scss
    toc: false
    fontsize: 0.9em
    resources:
      - assets/

execute:
  freeze: true
