project:
  type: website
  output-dir: docs

website:
  title: "me.log"
  site-url: https://gabrielvpina.github.io
  favicon: assets/favicon.png
  open-graph: true
  twitter-card: true
  navbar:
    background: "#251A30"
    foreground: "#ECE3FA"
    left:
      - href: posts/index.qmd
        text: "/posts"
      - href: publications/index.qmd
        text: "/publications"
      - href: projects/index.qmd
        text: "/projects"
      - href: about/index.qmd
        text: "/about"
    tools:
      - icon: github
        href: https://github.com/gabrielvpina
  page-footer:
    center: "© gabriel_pina :: 2026"
    border: false
    background: "#251A30"
    foreground: "#D6BCF5"

format:
  html:
    theme: flatly
    css: styles/retro.css
    toc: false
    fontsize: 0.9em
    resources:
      - assets/

execute:
  freeze: true
